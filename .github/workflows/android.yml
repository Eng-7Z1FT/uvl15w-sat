name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Add the repository secret ANDROID_KEYSTORE_B64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          # the password alone is useless without the keystore, which lives only in the ANDROID_KEYSTORE_B64 secret
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || 'No5IsnUDGqDC3EVWjfJHPLQe' }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk uvl15w-sat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uvl15w-sat-apk
          path: uvl15w-sat.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: UVL-15W سات (آخر نسخة)
          body: |
            تطبيق أندرويد لصفحة UVL-15W سات من 7Z1FT. نزّل uvl15w-sat.apk وثبّته.
            يفتح الصفحة داخل Chrome، فالبلوتوث العادي وSPP يشتغلون مثل الموقع بالضبط.
          files: uvl15w-sat.apk
          make_latest: true
