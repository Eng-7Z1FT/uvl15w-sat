# Temporary: check the keyless Esri tile services answer with images (Dammam area, zoom 8).
name: probe-tiles
on:
  push:
    paths: ['.github/workflows/probe-tiles.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for svc in World_Street_Map World_Imagery Reference/World_Boundaries_and_Places Canvas/World_Dark_Gray_Base Canvas/World_Dark_Gray_Reference; do
            r=$(curl -sS -m 20 -o t.bin -w "%{http_code} %{content_type} %{size_download}" -H "Referer: https://eng-7z1ft.github.io/" "https://server.arcgisonline.com/ArcGIS/rest/services/$svc/MapServer/tile/8/108/163")
            echo "::warning::$svc -> $r"
          done
          r=$(curl -sS -m 20 -o t.bin -w "%{http_code} %{content_type} %{size_download}" "https://a.basemaps.cartocdn.com/rastertiles/voyager/8/163/108.png"); echo "::warning::carto voyager -> $r"
