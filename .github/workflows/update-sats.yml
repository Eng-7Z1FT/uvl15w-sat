name: Update satellites

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sats.json
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          UA = {"User-Agent": "uvl15w-sat/1.0"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8")
          def band(f):
              return bool(f) and (136e6 <= f <= 174e6 or 400e6 <= f <= 480e6)
          url = "https://db.satnogs.org/api/transmitters/?format=json&alive=true&status=active"
          txs = []
          while url:
              d = json.loads(get(url))
              if isinstance(d, dict):
                  txs += d.get("results", []); url = d.get("next")
              else:
                  txs += d; url = None
          keep = []
          for t in txs:
              mode = (t.get("mode") or "").upper()
              if not (t.get("alive") and t.get("status") == "active" and band(t.get("downlink_low"))):
                  continue
              if mode != "FM" and "AFSK" not in mode:
                  continue
              keep.append({k: t.get(k) for k in ("uuid", "description", "alive", "status", "mode", "baud",
                                                   "uplink_low", "downlink_low", "invert", "norad_cat_id")})
          ids = sorted({t["norad_cat_id"] for t in keep if t["norad_cat_id"]})
          tle = {}
          def add_tle(text):
              L = [x.rstrip() for x in text.splitlines() if x.strip()]
              i = 0
              while i + 2 < len(L):
                  if L[i + 1].startswith("1 ") and L[i + 2].startswith("2 "):
                      tle[int(L[i + 1][2:7])] = [L[i].strip(), L[i + 1], L[i + 2]]; i += 3
                  else:
                      i += 1
          add_tle(get("https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=tle"))
          for n in ids:
              if n not in tle:
                  try:
                      add_tle(get(f"https://celestrak.org/NORAD/elements/gp.php?CATNR={n}&FORMAT=tle"))
                  except Exception as e:
                      print("no TLE for", n, e)
          out = {"updated": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "transmitters": keep,
                 "tle": {str(n): tle[n] for n in ids if n in tle}}
          json.dump(out, open("sats.json", "w"), separators=(",", ":"))
          print(len(keep), "transmitters,", len(out["tle"]), "TLEs")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sats.json
          git diff --cached --quiet || git commit -m "Update satellites"
          git push
