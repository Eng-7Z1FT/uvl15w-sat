<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شخصية 7Z1FT المتحركة</title>
<style>
:root{--g:#1e6b2f;--o:#e8922e;--c:#f3efe4;--bg:#0b0f0c;--panel:#122016}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--c);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px}
#box{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#0d1a10}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse at 30% 20%,#1a3a22 0,#0f2214 55%,#0a150d 100%)}
#stage::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(232,146,46,.04) 79px 80px),repeating-linear-gradient(0deg,transparent 0 79px,rgba(232,146,46,.04) 79px 80px);pointer-events:none}
.floor{position:absolute;left:0;right:0;top:648px;height:3px;background:linear-gradient(90deg,transparent,rgba(232,146,46,.5),transparent)}
.brand{position:absolute;left:28px;bottom:22px;font:900 30px Arial,sans-serif;color:var(--o);direction:ltr;letter-spacing:1px;z-index:3}
.num{position:absolute;right:28px;bottom:24px;font-size:22px;opacity:.6;z-index:3}
.slide{position:absolute;top:120px;width:600px;text-align:right;opacity:0;will-change:transform,opacity;z-index:1}
.slide.right{right:60px}.slide.left{left:60px}
.slide h1{margin:0 0 22px;font-size:66px;line-height:1.15;font-weight:900}
.slide h1::after{content:"";display:block;width:120px;height:8px;border-radius:4px;background:var(--o);margin-top:14px;margin-right:0}
.slide p{font-size:36px;margin:0;opacity:.9;line-height:1.5}
.slide ul{list-style:none;margin:0;padding:0}
.slide li{font-size:36px;margin:0 0 18px;padding-right:44px;position:relative}
.slide li::before{content:"";position:absolute;right:0;top:15px;width:22px;height:22px;border-radius:6px;background:var(--o)}
#svg{position:absolute;inset:0;z-index:2}
.badge{position:absolute;top:24px;left:50%;transform:translateX(-50%);background:var(--o);color:#111;font-weight:900;font-size:26px;padding:8px 22px;border-radius:30px;opacity:0;transition:opacity .3s;z-index:4}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.group{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);padding:6px;border-radius:12px;align-items:center}
.group span{font-size:14px;opacity:.7;padding:0 6px}
button,label.btn{background:#1b3322;color:var(--c);border:1px solid #2c4a33;border-radius:9px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
button.on{background:var(--o);color:#111;border-color:var(--o);font-weight:700}
button:hover,label.btn:hover{border-color:var(--o)}
input[type=file]{display:none}
.hint{font-size:14px;opacity:.6;margin-top:8px}
body.demo .controls,body.demo .hint{display:none}
body.demo .wrap{padding:0;max-width:none}
body.demo #box{border-radius:0;width:1280px;height:720px;aspect-ratio:auto}
</style>
</head>
<body>
<div class="wrap">
  <div id="box"><div id="stage">
    <div class="floor"></div>
    <div id="slides"></div>
    <svg id="svg" viewBox="0 0 1280 720" width="1280" height="720"><g id="fx"></g><g id="char"></g></svg>
    <div class="brand">7Z1FT</div>
    <div class="num" id="num"></div>
    <div class="badge" id="badge"></div>
  </div></div>

  <div class="controls">
    <div class="group"><button id="prev">→ السابق</button><button id="next">التالي ←</button><button id="auto">تشغيل تلقائي</button></div>
    <div class="group" id="trans"><span>الانتقال:</span>
      <button data-t="walk" class="on">A · مشي</button>
      <button data-t="jump">B · قفزة</button>
      <button data-t="slide">C · ينزلق مع الشريحة</button>
      <button data-t="pop">D · يختفي ويظهر</button>
    </div>
    <div class="group"><span>الكلام:</span>
      <button id="fake" class="on">كلام تجريبي</button>
      <label class="btn">ملف صوت<input type="file" id="file" accept="audio/*"></label>
      <button id="mic">الميكروفون</button>
    </div>
  </div>
  <div class="hint">الأسهم أو المسافة للتنقل بين الشرائح. لو رفعت ملف صوت (تعليقك الصوتي) أو شغلت المايك، الفم يتحرك على صوتك.</div>
</div>

<script>
const G='#1e6b2f',O='#e8922e',C='#f3efe4',D='#0a1a0e';
const SH=[300,268];
const LEGS=[[[300,450],[272,560],[258,678],[228,682]],[[300,450],[328,560],[342,678],[372,682]]];
const TORSO=[[300,250],[300,450]];
const base=o=>Object.assign({legs:LEGS,torso:TORSO,head:[300,180],dx:0,eyes:'dot',mouth:'smile',props:null},o);
const down=(o,dy)=>JSON.parse(JSON.stringify(o),(k,v)=>Array.isArray(v)&&v.length===2&&typeof v[0]==='number'?[v[0],v[1]+dy]:v);
const POSES={
  wave:base({arms:[[SH,[250,350],[238,432]],[SH,[388,226],[404,132]]],props:'wave'}),
  point:base({arms:[[SH,[236,336],[290,404]],[SH,[392,252],[478,212]]],dx:10,props:'point'}),
  typing:base({arms:[[[328,368],[372,438],[452,462]],[[328,368],[386,452],[486,462]]],
    legs:[[[296,548],[392,552],[398,682],[428,688]],[[296,548],[382,566],[372,692],[402,698]]],
    torso:[[330,340],[296,548]],head:[348,272],dx:12,eyes:'focus',mouth:'flat',props:'typing'}),
  thinking:base({arms:[[SH,[246,340],[338,346]],[SH,[356,326],[318,228]]],dx:6,eyes:'up',mouth:'hmm',props:'thinking'}),
  key:base({arms:[[SH,[250,352],[240,434]],[SH,[386,246],[424,170]]],dx:8,eyes:'happy',props:'key'}),
  celebrate:down(base({arms:[[SH,[236,196],[212,112]],[SH,[364,196],[388,112]]],
    legs:[[[300,440],[240,520],[270,610],[240,628]],[[300,440],[360,520],[330,610],[360,628]]],
    torso:[[300,250],[300,440]],eyes:'happy',mouth:'open',props:'confetti'}),52),
  shocked:base({arms:[[SH,[232,236],[226,162]],[SH,[368,236],[374,162]]],mouth:'o',props:'shocked'}),
};

const SLIDES=[
  {pose:'wave',x:330,f:1,side:'right',h:'أهلاً وسهلاً',p:'معكم المبرمج حميد بن حسن'},
  {pose:'point',x:960,f:-1,side:'left',h:'جهاز TYT',ul:['تعريف بالجهاز ومميزاته','طريقة توصيله بالكمبيوتر','ضبط الترددات والقنوات']},
  {pose:'typing',x:290,f:1,side:'right',h:'نبدأ البرمجة',ul:['نفتح برنامج البرمجة','نقرأ إعدادات الجهاز أول','نعدّل ونكتب على الجهاز']},
  {pose:'thinking',x:960,f:-1,side:'left',h:'طيب.. والسيارات؟',p:'وش علاقة البرمجة بمفاتيح السيارات؟'},
  {pose:'key',x:320,f:1,side:'right',h:'برمجة مفتاح السيارة',ul:['قراءة بيانات السيارة','إضافة مفتاح جديد','تجربة المفتاح']},
  {pose:'shocked',x:960,f:-1,side:'left',h:'انتبه!',p:'لا تفصل الكيبل أثناء البرمجة'},
  {pose:'celebrate',x:330,f:1,side:'right',h:'تمّت بنجاح',p:'تابعوني: Eng_7Z1FT'},
];
const TNAMES={walk:'A · مشي',jump:'B · قفزة',slide:'C · ينزلق مع الشريحة',pop:'D · يختفي ويظهر'};
const SCALE=.85, FLOOR=642;

/* ---------- math ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOutBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function lp(a,b,k){if(typeof a==='number')return lerp(a,b,k);if(Array.isArray(a))return a.map((v,i)=>lp(v,b[i],k));return k<.5?a:b}
function lerpPose(A,B,k){return {arms:lp(A.arms,B.arms,k),legs:lp(A.legs,B.legs,k),torso:lp(A.torso,B.torso,k),head:lp(A.head,B.head,k),
  dx:lerp(A.dx,B.dx,k),eyes:k<.5?A.eyes:B.eyes,mouth:k<.5?A.mouth:B.mouth,props:k<.5?A.props:B.props}}
const clone=o=>JSON.parse(JSON.stringify(o));

function walkPose(ph){
  const bob=-Math.abs(Math.sin(ph))*9, hip=[300,446+bob];
  const legs=[0,1].map(i=>{const p=ph+i*Math.PI,a=.42*Math.sin(p),bend=.75*Math.max(0,Math.cos(p));
    const knee=[hip[0]+115*Math.sin(a),hip[1]+115*Math.cos(a)],b=a-bend;
    const foot=[knee[0]+118*Math.sin(b),knee[1]+118*Math.cos(b)];return [hip,knee,foot,[foot[0]+28,foot[1]+3]]});
  const sh=[304,268+bob];
  const arms=[1,0].map(i=>{const p=ph+i*Math.PI,a=-.5*Math.sin(p),el=[sh[0]+88*Math.sin(a),sh[1]+88*Math.cos(a)],b=a+.5;
    return [sh,el,[el[0]+84*Math.sin(b),el[1]+84*Math.cos(b)]]});
  return {arms,legs,torso:[[306,250+bob],[300,446+bob]],head:[308,180+bob],dx:10,eyes:'dot',mouth:'smile',props:null};
}

/* ---------- idle + talking motion ---------- */
function animate(P,name,t,m){
  P=clone(P);let dy=0;const b=Math.sin(t*2.2)*3;
  P.head[1]+=b-m*5;P.head[0]+=Math.sin(t*5.3)*m*4;P.torso[0][1]+=b;
  P.arms.forEach(a=>{a[0][1]+=b;a[1][1]+=b;a[2][1]+=b*.5});
  const h=P.arms[1][2],e=P.arms[1][1];
  if(name==='wave'){h[0]+=Math.sin(t*9)*14;e[0]+=Math.sin(t*9)*4}
  if(name==='point'){h[1]+=Math.sin(t*2.5)*7-m*10}
  if(name==='typing'){P.arms[0][2][1]+=Math.max(0,Math.sin(t*18))*-6;h[1]+=Math.max(0,Math.sin(t*18+2))*-6}
  if(name==='thinking'){h[1]+=Math.sin(t*4)*2.5}
  if(name==='key'){h[1]+=Math.sin(t*6)*5}
  if(name==='shocked'){const s=Math.sin(t*38)*2;P.head[0]+=s;P.arms.forEach(a=>a[2][0]+=s)}
  if(name==='celebrate'){dy=-Math.abs(Math.sin(t*5))*28;P.arms[0][2][0]-=Math.sin(t*10)*8;h[0]+=Math.sin(t*10)*8}
  return {P,dy};
}

/* ---------- drawing ---------- */
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const pl=(a,col,w)=>`<polyline points="${pts(a)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function face(P,blink,m){
  const [hx,hy]=P.head,ex=hx+P.dx*1.4;let s=`<g transform="translate(${ex.toFixed(1)},${(hy+6).toFixed(1)})" fill="${C}" stroke="${C}" stroke-linecap="round">`;
  const ry=Math.max(1.3,8*(1-blink));
  if(P.eyes==='dot')s+=`<ellipse cx="-19" cy="-8" rx="8" ry="${ry}" stroke="none"/><ellipse cx="19" cy="-8" rx="8" ry="${ry}" stroke="none"/>`;
  else if(P.eyes==='up')s+=`<ellipse cx="-15" cy="-16" rx="8" ry="${ry}" stroke="none"/><ellipse cx="23" cy="-16" rx="8" ry="${ry}" stroke="none"/>`;
  else if(P.eyes==='happy')s+=`<path d="M-29,-4 Q-19,-19 -9,-4 M9,-4 Q19,-19 29,-4" fill="none" stroke-width="6"/>`;
  else if(P.eyes==='focus')s+=`<path d="M-28,-8 h17 M11,-8 h17" stroke-width="7"/>`;
  if(m>.06)s+=`<ellipse cx="0" cy="${30+m*4}" rx="${14+6*m}" ry="${3+16*m}" fill="${D}" stroke-width="4"/>`;
  else if(P.mouth==='smile')s+=`<path d="M-18,24 Q0,41 18,24" fill="none" stroke-width="6"/>`;
  else if(P.mouth==='open')s+=`<path d="M-21,22 Q0,50 21,22Z" stroke="none"/>`;
  else if(P.mouth==='flat')s+=`<path d="M-12,30 h24" stroke-width="6"/>`;
  else if(P.mouth==='hmm')s+=`<path d="M-13,32 q13,-10 26,0" fill="none" stroke-width="6"/>`;
  else if(P.mouth==='o')s+=`<ellipse cx="0" cy="32" rx="10" ry="14" stroke="none"/>`;
  return s+'</g>';
}
function figure(P,blink,m){
  let s='';
  for(const [col,add] of [[O,10],[G,0]]){s+=pl(P.torso,col,30+add);for(const l of [...P.arms,...P.legs])s+=pl(l,col,16+add)}
  const [hx,hy]=P.head;
  s+=`<path d="M${hx-56},${hy+20} Q${hx-62},${hy-58} ${hx+2},${hy-66} Q${hx+60},${hy-60} ${hx+56},${hy+14} Q${hx+40},${hy+62} ${hx},${hy+64} Q${hx-44},${hy+62} ${hx-56},${hy+20}Z" fill="${G}" stroke="${O}" stroke-width="6" stroke-linejoin="round"/>`;
  return s+face(P,blink,m);
}
function txt(ch,x,y,size,col,flip,op=1){
  const tf=flip?` transform="translate(${2*x},0) scale(-1,1)"`:'';
  return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="${size}" fill="${col}" opacity="${op}"${tf}>${ch}</text>`;
}
const stroke=(d,col=O,w=6)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
function props(name,t,flip){
  switch(name){
  case 'wave':return stroke('M430,110 q16,22 4,48')+stroke('M452,96 q24,34 6,72');
  case 'point':return stroke('M506,186 l26,-14')+stroke('M510,212 l30,0')+stroke('M506,238 l26,14');
  case 'thinking':return txt('?',440,122+Math.sin(t*3)*6,110,O,flip)+txt('?',386,88+Math.sin(t*3+1)*5,54,C,flip,.8);
  case 'shocked':return txt('!',440,118,100,O,flip)+stroke('M206,128 l-24,-20',C,5)+stroke('M394,128 l24,-20',C,5)+stroke('M300,96 l0,-24',C,5);
  case 'key':{const r=-25+Math.sin(t*6)*6;
    return `<g transform="translate(430,${172+Math.sin(t*6)*5}) rotate(${r})"><rect x="-22" y="-62" width="44" height="66" rx="16" fill="${D}" stroke="${O}" stroke-width="5"/><circle cx="0" cy="-42" r="7" fill="${O}"/><circle cx="0" cy="-22" r="6" fill="${C}"/><path d="M-7,-62 v-58 h14 v14 h-8 v8 h8 v10 h-8 v26" fill="#cfd4d6" stroke="${O}" stroke-width="3"/></g>`
      +[[500,60,14,C],[380,70,10,O],[520,170,9,C]].map(([x,y,r,c],i)=>{const k=.6+.4*Math.sin(t*4+i*2);r*=k;
        return `<path d="M${x},${y-r} Q${x+2},${y-2} ${x+r},${y} Q${x+2},${y+2} ${x},${y+r} Q${x-2},${y+2} ${x-r},${y} Q${x-2},${y-2} ${x},${y-r}Z" fill="${c}"/>`}).join('');}
  case 'typing':{const blink=(Math.sin(t*6)>0)?C:O;
    return `<path d="M232,560 h136" stroke="${O}" stroke-width="22" stroke-linecap="round"/><path d="M232,560 h136" stroke="${G}" stroke-width="14" stroke-linecap="round"/>`
      +stroke('M250,568 l-12,150 M350,568 l12,150 M244,650 h112',O,8)+stroke('M404,478 h170 M420,484 v158 M560,484 v158',O,10)
      +`<polygon points="402,476 540,476 548,466 410,466" fill="${G}" stroke="${O}" stroke-width="5" stroke-linejoin="round"/><polygon points="528,470 548,470 588,352 568,352" fill="${G}" stroke="${O}" stroke-width="5" stroke-linejoin="round"/><circle cx="560" cy="412" r="6" fill="${blink}"/>`
      +[0,1,2].map(i=>{const o=Math.max(0,Math.sin(t*18+i*2));return `<path d="M${430+i*32},${440-o*4} l${(i-1)*6},-12" stroke="${O}" stroke-width="5" stroke-linecap="round" opacity="${o}"/>`}).join('');}
  case 'confetti':return [[120,90,30,O],[180,40,-20,C],[450,50,45,O],[500,130,-35,C],[90,220,60,C],[520,250,20,O],[250,30,10,O],[380,20,-50,C]]
      .map(([x,y,r,c],i)=>{const yy=((y+t*90+i*37)%300)-10;return `<rect x="${x+Math.sin(t*2+i)*14}" y="${yy}" width="14" height="8" rx="2" fill="${c}" transform="rotate(${r+t*120*(i%2?1:-1)} ${x} ${yy})"/>`}).join('');
  }
  return '';
}
function place(inner,x,y,f,{sx=1,sy=1,rot=0,op=1}={}){
  return `<g opacity="${op}" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot}) scale(${(SCALE*sx*f).toFixed(3)},${(SCALE*sy).toFixed(3)}) translate(-300,-680)">${inner}</g>`;
}

/* ---------- slides DOM ---------- */
const slidesEl=document.getElementById('slides');
const sEls=SLIDES.map(s=>{const d=document.createElement('div');d.className='slide '+s.side;
  d.innerHTML=`<h1>${s.h}</h1>`+(s.p?`<p>${s.p}</p>`:'')+(s.ul?`<ul>${s.ul.map(li=>`<li>${li}</li>`).join('')}</ul>`:'');slidesEl.appendChild(d);return d});

/* ---------- state ---------- */
const params=new URLSearchParams(location.search), DEMO=params.has('demo');
if(DEMO)document.body.classList.add('demo');
let cur=0,tr=null,ttype='walk',fakeTalk=true,clock=0,last=null,m=0,blinkAt=1.5,autoTimer=null;
const DUR={jump:1.1,slide:1.05,pop:.85};
function go(i,type){
  if(tr||i<0||i>=SLIDES.length||i===cur)return;
  type=type||ttype;const a=SLIDES[cur],b=SLIDES[i];
  const dur=type==='walk'?Math.max(.8,Math.abs(b.x-a.x)/330):DUR[type];
  tr={from:cur,to:i,type,t0:clock,dur};showBadge(TNAMES[type]);
}
let badgeT=null;function showBadge(t){const el=document.getElementById('badge');el.textContent='الانتقال: '+t;el.style.opacity=1;clearTimeout(badgeT);badgeT=setTimeout(()=>el.style.opacity=0,1400)}

/* ---------- audio / lip sync ---------- */
let analyser=null,buf=null,actx=null;const audioEl=new Audio();
function ensureCtx(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();analyser=actx.createAnalyser();analyser.fftSize=1024;buf=new Float32Array(analyser.fftSize);return actx}
let mediaSrc=null;
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;ensureCtx();
  audioEl.src=URL.createObjectURL(f);if(!mediaSrc)mediaSrc=actx.createMediaElementSource(audioEl);
  mediaSrc.disconnect();mediaSrc.connect(analyser);analyser.connect(actx.destination);actx.resume();audioEl.play();setFake(false)};
document.getElementById('mic').onclick=async e=>{try{const st=await navigator.mediaDevices.getUserMedia({audio:true});ensureCtx();
  actx.createMediaStreamSource(st).connect(analyser);actx.resume();e.target.classList.add('on');setFake(false)}catch(err){e.target.textContent='المايك غير متاح هنا'}};
function setFake(v){fakeTalk=v;document.getElementById('fake').classList.toggle('on',v)}
document.getElementById('fake').onclick=()=>setFake(!fakeTalk);
function mouthLevel(t){
  let target=0;
  if(analyser){analyser.getFloatTimeDomainData(buf);let s=0;for(const v of buf)s+=v*v;target=clamp((Math.sqrt(s/buf.length)-.015)*9)}
  else if(fakeTalk){const gate=(Math.sin(t*1.3)+Math.sin(t*.71+1))>-.5?1:0;target=gate*(.5+.5*Math.sin(t*15.7))*(.55+.45*Math.sin(t*3.3))}
  m+= (target-m)*(target>m?.55:.25);return m;
}

/* ---------- frame ---------- */
function frame(ts){
  if(!window.__manual){const now=ts/1000;if(last!==null)clock+=Math.min(.05,now-last);last=now}
  const t=clock;const mm=mouthLevel(t);
  if(t>blinkAt+.14)blinkAt=t+2+Math.random()*3;
  const blink=t>blinkAt?Math.sin(clamp((t-blinkAt)/.14)*Math.PI):0;
  let html='',textOps=SLIDES.map(()=>({o:0,x:0,y:0}));
  const S=i=>SLIDES[i];
  if(!tr){
    const s=S(cur),{P,dy}=animate(POSES[s.pose],s.pose,t,mm);
    html=place(props(P.props,t,s.f<0)+figure(P,blink,mm),s.x,FLOOR+dy,s.f);textOps[cur].o=1;
  }else{
    const k=clamp((t-tr.t0)/tr.dur),a=S(tr.from),b=S(tr.to);
    const A=animate(POSES[a.pose],a.pose,t,mm).P,B=animate(POSES[b.pose],b.pose,t,mm).P;
    if(tr.type==='walk'){
      const dist=b.x-a.x,e=ease(k),x=a.x+dist*e,ph=Math.abs(dist)*e/26;
      let P=dist?lerpPose(lerpPose(A,walkPose(ph),smooth(0,.18,k)),B,smooth(.82,1,k)):lerpPose(A,B,smooth(0,1,k));
      const f=k<.12?a.f:k>.88?b.f:(dist>0?1:dist<0?-1:b.f);
      const po=k<.5?1-smooth(0,.15,k):smooth(.85,1,k),pn=k<.5?A.props:B.props;
      html=`<g opacity="${po}">${place(props(pn,t,f<0),x,FLOOR,f)}</g>`+place(figure(P,blink,mm),x,FLOOR,f);
      textOps[tr.from]={o:1-smooth(0,.35,k),x:0,y:-30*smooth(0,.35,k)};textOps[tr.to]={o:smooth(.6,1,k),x:0,y:30*(1-smooth(.6,1,k))};
    }else if(tr.type==='jump'){
      const TUCK=POSES.celebrate,x=lerp(a.x,b.x,ease(k)),dy=-Math.sin(Math.PI*k)*240;
      const P=k<.5?lerpPose(A,TUCK,smooth(0,.3,k)):lerpPose(TUCK,B,smooth(.7,1,k));
      const f=k<.5?a.f:b.f,sy=k>.88?1-.14*Math.sin((k-.88)/.12*Math.PI):1,sx=2-sy;
      const po=k<.5?1-smooth(0,.15,k):smooth(.85,1,k);
      html=place(`<g opacity="${po}">${props(k<.5?A.props:B.props,t,f<0)}</g>`+figure(P,blink,mm),x,FLOOR+dy,f,{sx,sy,rot:Math.sin(Math.PI*k)*(b.x>a.x?8:-8)});
      textOps[tr.from]={o:1-smooth(0,.35,k),x:0,y:-30*smooth(0,.35,k)};textOps[tr.to]={o:smooth(.6,1,k),x:0,y:30*(1-smooth(.6,1,k))};
    }else if(tr.type==='slide'){
      if(k<.5){const off=-Math.pow(k*2,2.2)*1500;html=place(props(A.props,t,a.f<0)+figure(A,blink,mm),a.x+off,FLOOR,a.f,{rot:-6*smooth(0,.3,k)});textOps[tr.from]={o:1,x:off,y:0}}
      else{const q=(k-.5)*2,off=Math.pow(1-q,2.2)*1500;html=place(props(B.props,t,b.f<0)+figure(B,blink,mm),b.x+off,FLOOR,b.f,{rot:6*(1-smooth(.6,1,q))});textOps[tr.to]={o:1,x:off,y:0}}
    }else if(tr.type==='pop'){
      if(k<.45){const q=k/.45,sc=1-q*q;html=place(props(A.props,t,a.f<0)+figure(A,blink,mm),a.x,FLOOR-280*SCALE*(1-sc),a.f,{sx:sc,sy:sc,rot:q*200,op:1-q*.3})+burst(a.x,FLOOR-250,q)}
      else if(k>.55){const q=(k-.55)/.45,sc=easeOutBack(q);html=place(props(B.props,t,b.f<0)+figure(B,blink,mm),b.x,FLOOR,b.f,{sx:sc,sy:sc})+burst(b.x,FLOOR-250,q)}
      else html=burst(a.x,FLOOR-250,1)+burst(b.x,FLOOR-250,0);
      textOps[tr.from]={o:1-smooth(0,.4,k),x:0,y:0};textOps[tr.to]={o:smooth(.55,.9,k),x:0,y:0};
    }
    if(k>=1){cur=tr.to;tr=null}
  }
  document.getElementById('char').innerHTML=html;
  sEls.forEach((el,i)=>{const o=textOps[i];el.style.opacity=o.o;el.style.transform=`translate(${o.x}px,${o.y}px)`});
  document.getElementById('num').textContent=`${(tr?tr.to:cur)+1} / ${SLIDES.length}`;
  if(!window.__manual)requestAnimationFrame(frame);
}
function burst(x,y,q){if(q<=0||q>=1)return '';let s='';for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=40+q*140;
  s+=`<circle cx="${x+Math.cos(a)*r}" cy="${y+Math.sin(a)*r}" r="${9*(1-q)}" fill="${i%2?O:C}"/>`}return s}

/* ---------- UI ---------- */
function fit(){if(DEMO)return;const w=document.getElementById('box').clientWidth;document.getElementById('stage').style.transform=`scale(${w/1280})`}
addEventListener('resize',fit);fit();
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.querySelectorAll('#trans button').forEach(b=>b.onclick=()=>{ttype=b.dataset.t;document.querySelectorAll('#trans button').forEach(x=>x.classList.toggle('on',x===b));showBadge(TNAMES[ttype])});
document.getElementById('auto').onclick=e=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;e.target.classList.remove('on');return}
  e.target.classList.add('on');autoTimer=setInterval(()=>{if(cur>=SLIDES.length-1&&!tr){cur=0}else go(cur+1)},3200)};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' '){e.preventDefault();go(cur+1)}if(e.key==='ArrowRight')go(cur-1)});

/* demo recorder hook: drive time manually, cycling transition types */
window.__demoStep=dt=>{clock+=dt;frame(0)};
window.__go=(i,tp)=>go(i,tp);
if(!window.__manual)requestAnimationFrame(frame);
</script>
</body>
