<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشهد 7Z1FT</title>
<style>
body{margin:0;background:#050806;color:#f3efe4;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:12px 16px}
svg{width:100%;height:auto;display:block;border-radius:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{background:#1b3322;color:#f3efe4;border:1px solid #2c4a33;border-radius:9px;padding:9px 14px;font:inherit;cursor:pointer}
button.on{background:#e8922e;color:#111;border-color:#e8922e;font-weight:700}
body.demo .wrap{padding:0;max-width:none}body.demo .bar{display:none}body.demo svg{border-radius:0;width:1920px}
</style></head><body><div class="wrap">
<svg id="s" viewBox="0 0 1920 1080"></svg>
<div class="bar"><button data-m="radio" class="on">مقاطع الأجهزة اللاسلكية</button><button data-m="car">برمجة السيارات</button><button id="re">إعادة</button></div>
</div>
<script src="engine.js"></script><script src="scene.js"></script>
<script>
const q=new URLSearchParams(location.search);if(q.has('demo'))document.body.classList.add('demo');
let mode=q.get('mode')||'radio',clock=0,last=null,m=0;
function fakeMouth(t){const g=(Math.sin(t*1.3)+Math.sin(t*.71+1))>-.5?1:0,v=g*(.5+.5*Math.sin(t*15.7))*(.55+.45*Math.sin(t*3.3));m+=(v-m)*(v>m?.55:.25);return m}
function draw(){const t=Math.min(clock,SCRIPTS[mode].end);document.getElementById('s').innerHTML=sceneFrame(mode,t,fakeMouth(t),stickmanBlink(t))}
function loop(ts){const now=ts/1000;if(last!==null)clock+=Math.min(.05,now-last);last=now;if(clock>SCRIPTS[mode].end+1.5)clock=0;draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;clock=0;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});
document.getElementById('re').onclick=()=>clock=0;
window.__step=dt=>{clock+=dt;draw()};
if(window.__manual)draw();else requestAnimationFrame(loop);
</script></body></html>
